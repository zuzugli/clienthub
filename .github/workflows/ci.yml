name: CI/CD API ClientHub

# Le pipeline se lance à chaque push sur la branche main
on:
  push:
    branches: [main]

env:
  # Nom de l'image sur Docker Hub : <utilisateur>/clienthub-api
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/clienthub-api
  # Nom fixe du conteneur sur la VM (déploiement idempotent)
  CONTAINER_NAME: gliniak_zuzanna
  # Port attribué sur la VM
  APP_PORT: 8015

jobs:

  # ---------- Job 1 : tests unitaires ----------
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de la branche
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        working-directory: api
        run: pip install -r requirements.txt pytest

      - name: Lancer les tests unitaires
        working-directory: api
        run: pytest -v

  # ---------- Job 2 : tests E2E ----------
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de la branche
        uses: actions/checkout@v4

      - name: Générer des mots de passe MySQL aléatoires (jamais écrits dans le dépôt)
        run: |
          echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 16)" >> .env
          echo "MYSQL_USER=clienthub_user" >> .env
          echo "MYSQL_PASSWORD=$(openssl rand -hex 16)" >> .env

      - name: Démarrer l'application complète (API + MySQL + Nginx)
        run: docker compose up -d --build

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances E2E
        run: pip install -r e2e/requirements.txt

      - name: Lancer les tests E2E
        run: pytest -v e2e

      - name: Afficher les logs en cas d'échec
        if: failure()
        run: docker compose logs

      - name: Arrêter l'application
        if: always()
        run: docker compose down -v

  # ---------- Job 3 : build & push Docker Hub ----------
  build-push:
    needs: [unit-tests, e2e-tests]        # uniquement si les jobs 1 et 2 sont OK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de la branche
        uses: actions/checkout@v4

      - name: Build de l'image Docker (tags latest + SHA du commit)
        run: docker build -t $IMAGE:latest -t $IMAGE:${{ github.sha }} ./api

      - name: Lancer le conteneur et tester /health
        run: |
          docker run -d --name api-test -p 5000:5000 $IMAGE:latest
          for i in $(seq 1 10); do
            if curl -sf http://localhost:5000/health | grep -q '"status":"ok"'; then
              echo "Healthcheck OK"
              docker rm -f api-test
              exit 0
            fi
            sleep 2
          done
          echo "Healthcheck en échec"
          docker logs api-test
          exit 1

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push de l'image sur Docker Hub
        run: |
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}

  # ---------- Job 4 : déploiement sur la VM Azure ----------
  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Déployer sur la VM via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          script: |
            set -e
            # Récupérer l'image exacte de ce commit depuis Docker Hub
            docker pull ${{ env.IMAGE }}:${{ github.sha }}
            # Supprimer l'ancien conteneur s'il existe (idempotent : jamais de doublon)
            docker rm -f ${{ env.CONTAINER_NAME }} || true
            # Relancer l'application avec un nom fixe
            docker run -d --name ${{ env.CONTAINER_NAME }} --restart unless-stopped \
              -p ${{ env.APP_PORT }}:5000 ${{ env.IMAGE }}:${{ github.sha }}

      - name: Vérifier que l'application répond sur l'IP publique
        run: |
          for i in $(seq 1 15); do
            if curl -sf http://${{ secrets.VM_HOST }}:${{ env.APP_PORT }}/health | grep -q '"status":"ok"'; then
              echo "Application en ligne sur la VM"
              exit 0
            fi
            sleep 4
          done
          echo "L'application ne répond pas sur la VM"
          exit 1
