name: CI/CD API ClientHub

# Le pipeline se lance à chaque push sur la branche main
on:
  push:
    branches: [main]

jobs:
  build-test-push:
    runs-on: ubuntu-latest

    env:
      # Nom de l'image sur Docker Hub : <utilisateur>/clienthub-api
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/clienthub-api

    steps:
      # 1. Checkout : récupérer le code de la branche
      - name: Checkout de la branche
        uses: actions/checkout@v4

      # 2. Exécuter les tests
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lancer les tests
        working-directory: api
        run: |
          pip install -r requirements.txt pytest
          pytest -v

      # 3. Construire l'image avec deux tags : latest + SHA du commit
      - name: Build de l'image Docker
        run: docker build -t $IMAGE:latest -t $IMAGE:${{ github.sha }} ./api

      # 4. Lancer rapidement le conteneur et vérifier /health
      - name: Lancer le conteneur et tester /health
        run: |
          docker run -d --name api-test -p 5000:5000 $IMAGE:latest
          for i in $(seq 1 10); do
            if curl -sf http://localhost:5000/health | grep -q '"status":"ok"'; then
              echo "Healthcheck OK"
              docker rm -f api-test
              exit 0
            fi
            sleep 2
          done
          echo "Healthcheck en échec"
          docker logs api-test
          exit 1

      # 5. Se connecter à Docker Hub (avant le push)
      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Pousser l'image sur le registry (les deux tags)
      - name: Push de l'image sur Docker Hub
        run: |
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
